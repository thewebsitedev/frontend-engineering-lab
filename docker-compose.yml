services:
  app-blue:
    build: .
    container_name: app-blue
    restart: always
    ports:
      - "3001:3000"
    networks:
      - web

  app-green:
    build: .
    container_name: app-green
    restart: always
    ports:
      - "3002:3000"
    networks:
      - web

networks:
  web:
    external: true